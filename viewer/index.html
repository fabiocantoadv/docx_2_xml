<style>
/* Layout: barra de ferramentas fixa; abaixo, indice lateral + coluna de leitura (~68ch). Abas: Artigo | XML | Verificacao */
:root {
  --bg: #f6f8fa;
  --paper: #ffffff;
  --ink: #17212b;
  --ink-2: #4a5866;
  --ink-3: #7b8896;
  --rule: #dbe2e9;
  --wash: #edf2f6;
  --accent: #1f5582;
  --accent-wash: #e3edf6;
  --cite: #8a4b0f;
  --cite-wash: #fbf0e3;
  --ok: #2e7d4f;
  --warn: #a8670c;
  --bad: #b3322b;
  --code-tag: #1f5582;
  --code-attr: #7a3e9d;
  --code-val: #2e7d4f;
  --code-txt: #17212b;
  --code-com: #7b8896;
  --f-read: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --s-1: 0.8125rem; --s-0: 0.9375rem; --s1: 1.125rem; --s2: 1.375rem; --s3: 1.875rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151b; --paper: #151d25; --ink: #e3e9ef; --ink-2: #aab6c2; --ink-3: #7d8a97; --rule: #2a3642; --wash: #1b252f;
  --accent: #8ab8e0; --accent-wash: #1d2e3e; --cite: #e8b27a; --cite-wash: #33261a; --ok: #6cc497; --warn: #e3b05e; --bad: #f08a80;
  --code-tag: #8ab8e0; --code-attr: #c9a2e6; --code-val: #8fd3a8; --code-txt: #e3e9ef; --code-com: #7d8a97; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f151b; --paper: #151d25; --ink: #e3e9ef; --ink-2: #aab6c2; --ink-3: #7d8a97; --rule: #2a3642; --wash: #1b252f;
  --accent: #8ab8e0; --accent-wash: #1d2e3e; --cite: #e8b27a; --cite-wash: #33261a; --ok: #6cc497; --warn: #e3b05e; --bad: #f08a80;
  --code-tag: #8ab8e0; --code-attr: #c9a2e6; --code-val: #8fd3a8; --code-txt: #e3e9ef; --code-com: #7d8a97; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: var(--s-0); line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { font-weight: 600; letter-spacing: 0.01em; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-weight: 400; color: var(--ink-3); font-size: var(--s-1); }
.ver { font-family: var(--f-code); font-size: 10px; color: var(--ink-3); }
.loader { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
.btn { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: var(--s-1); font-weight: 500; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.btn.primary:hover { filter: brightness(1.08); color: var(--paper); }
select.btn { padding-right: 8px; }
.tabs { display: flex; gap: 2px; background: var(--wash); border-radius: 8px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: var(--s-1); font-weight: 500; color: var(--ink-2); }
.tab[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tab .n { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; font-size: 11px; line-height: 18px; text-align: center; }
.n.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.n.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.n.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }

.wrap { max-width: 1240px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.grid { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 14px; } .grid .toc-wrap { position: static; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; } .grid .toc-wrap > summary { display: list-item; cursor: pointer; font-weight: 600; font-size: var(--s-1); } .grid .toc-wrap[open] > summary { margin-bottom: 10px; } nav.toc { max-height: none !important; } }

.toc-wrap { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); min-width: 0; }
.toc-wrap > summary { display: none; }
nav.toc {  top: calc(env(safe-area-inset-top, 0px) + 72px); max-height: calc(100vh - 100px); overflow: auto; font-size: var(--s-1); }
.toc h4 { margin: 18px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; }
.toc h4:first-child { margin-top: 0; }
.toc a { display: block; padding: 3px 8px; border-left: 2px solid var(--rule); color: var(--ink-2); text-decoration: none; line-height: 1.35; }
.toc a:hover { color: var(--accent); border-color: var(--accent); }
.toc a.l2 { padding-left: 20px; }
.toc .meta-line { color: var(--ink-3); padding: 0 8px; }

.drop { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--accent) 14%, transparent); border: 3px dashed var(--accent);
  display: grid; place-items: center; font-size: var(--s2); font-weight: 600; color: var(--accent); pointer-events: none; }
.toast { margin: 0 0 16px; padding: 10px 14px; border-radius: 8px; background: var(--cite-wash); color: var(--ink); border: 1px solid color-mix(in srgb, var(--cite) 35%, transparent); font-size: var(--s-1); }
.toast.err { background: color-mix(in srgb, var(--bad) 10%, var(--paper)); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }

/* ---------- artigo ---------- */
.paper a, .fns a, .pop a { overflow-wrap: anywhere; }
article.paper { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: clamp(20px, 4vw, 48px); min-width: 0; }
.paper .read { max-width: 68ch; }
.jline { font-size: var(--s-1); color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 18px; }
.jline b { color: var(--ink-2); font-weight: 600; }
.chip { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); background: var(--accent-wash); padding: 2px 8px; border-radius: 4px; }
.lang { font-family: var(--f-code); font-size: 10px; color: var(--ink-3); border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; vertical-align: 2px; margin-right: 6px; text-transform: uppercase; }
h1.atitle { font-family: var(--f-read); font-weight: 500; font-size: var(--s3); line-height: 1.18; margin: 10px 0 12px; text-wrap: balance; letter-spacing: -0.01em; }
.ttitle { font-family: var(--f-read); font-style: italic; color: var(--ink-2); font-size: var(--s1); margin: 4px 0; text-wrap: balance; }
.authors { margin: 22px 0 6px; font-family: var(--f-read); font-size: var(--s1); }
.author { display: inline; }
.author + .author::before { content: ", "; }
.author sup { font-family: var(--f-ui); font-size: 11px; color: var(--accent); margin-left: 1px; }
.orcid { font-family: var(--f-ui); font-size: 10px; font-weight: 600; color: var(--ok); text-decoration: none; border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; margin-left: 4px; vertical-align: 2px; }
.affs { font-size: var(--s-1); color: var(--ink-2); margin: 8px 0 0; padding: 0; list-style: none; }
.affs li { margin: 2px 0; }
.affs .country { font-family: var(--f-code); font-size: 10px; color: var(--ink-3); margin-left: 4px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 20px; margin: 22px 0; padding: 14px 0; border-block: 1px solid var(--rule); font-size: var(--s-1); }
.facts dt { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.facts dd { margin: 2px 0 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.abs { margin: 26px 0; }
.abs-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.abs-tabs button { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: var(--s-1); }
.abs-tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.abs-body { background: var(--wash); border-radius: 8px; padding: 16px 20px; font-family: var(--f-read); font-size: var(--s0); }
.abs-body h3 { font-family: var(--f-ui); font-size: var(--s-1); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.abs-body .asec { margin: 8px 0; }
.abs-body .asec b { font-family: var(--f-ui); font-size: var(--s-1); color: var(--accent); margin-right: 6px; }
.abs-body p { margin: 0; }
.kwd { margin-top: 12px; font-size: var(--s-1); font-family: var(--f-ui); }
.kwd span.k { display: inline-block; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 7px; margin: 3px 4px 0 0; }
.notes-box { font-size: var(--s-1); color: var(--ink-2); margin: 10px 0; }
.notes-box p { margin: 3px 0; }

.body { font-family: var(--f-read); font-size: 1.0625rem; line-height: 1.65; }
.body h2 { font-family: var(--f-ui); font-size: var(--s1); font-weight: 600; margin: 2.2em 0 0.6em; text-wrap: balance; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.body h3 { font-family: var(--f-ui); font-size: var(--s0); font-weight: 600; margin: 1.8em 0 0.5em; }
.body h4 { font-family: var(--f-ui); font-size: var(--s-1); font-weight: 600; margin: 1.5em 0 0.4em; }
.sectype { font-family: var(--f-code); font-size: 10px; font-weight: 400; color: var(--ink-3); border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; }
.body p { margin: 0 0 1em; }
.body ul, .body ol { padding-left: 1.4em; margin: 0 0 1em; }
.body li { margin: 0.35em 0; }
.body li > p { margin: 0; }
ol.alpha-lower { list-style-type: lower-alpha; } ol.alpha-upper { list-style-type: upper-alpha; }
ol.roman-lower { list-style-type: lower-roman; } ol.roman-upper { list-style-type: upper-roman; } ul.simple { list-style: none; padding-left: 0; }
blockquote { margin: 1em 0 1em 1.2em; padding-left: 1em; border-left: 2px solid var(--rule); color: var(--ink-2); }
a.cite { color: var(--cite); text-decoration: none; border-bottom: 1px dotted var(--cite); cursor: pointer; }
a.cite:hover, a.cite.on { background: var(--cite-wash); }
a.fnref { text-decoration: none; font-family: var(--f-ui); font-size: 0.75em; }
a.bad-link { color: var(--bad); border-bottom: 1px dashed var(--bad); }

figure.fig, .twrap { margin: 1.8em 0; padding: 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); font-family: var(--f-ui); }
figure.fig figcaption, .twrap .cap { font-size: var(--s-1); color: var(--ink-2); margin-bottom: 10px; }
figure.fig figcaption b, .twrap .cap b { color: var(--ink); margin-right: 6px; }
figure.fig img { display: block; margin: 0 auto; max-width: 100%; height: auto; background: #fff; border-radius: 4px; cursor: zoom-in; }
.attrib { font-size: var(--s-1); color: var(--ink-3); margin-top: 8px; }
.fileref { font-family: var(--f-code); font-size: 11px; color: var(--ink-3); margin-top: 6px; overflow-wrap: anywhere; }
.missing { display: grid; place-items: center; text-align: center; min-height: 160px; border: 2px dashed color-mix(in srgb, var(--bad) 50%, transparent); border-radius: 6px; color: var(--bad); font-size: var(--s-1); padding: 16px; }
.tscroll { overflow-x: auto; }
.twrap table { border-collapse: collapse; width: 100%; font-size: var(--s-1); }
.twrap th, .twrap td { border: 1px solid var(--rule); padding: 5px 8px; text-align: left; vertical-align: top; }
.twrap th { background: var(--wash); font-weight: 600; }

.back { margin-top: 3em; padding-top: 1.5em; border-top: 1px solid var(--rule); }
.back h2 { font-family: var(--f-ui); font-size: var(--s1); font-weight: 600; margin: 1.6em 0 0.8em; }
ol.refs { list-style: none; padding: 0; margin: 0; font-family: var(--f-read); font-size: var(--s0); }
ol.refs li { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--wash); scroll-margin-top: 90px; }
ol.refs li.flash { background: var(--cite-wash); }
.rid { font-family: var(--f-code); font-size: 11px; color: var(--ink-3); padding-top: 3px; }
.ref-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 4px; font-family: var(--f-ui); font-size: 11px; color: var(--ink-3); align-items: center; }
.ref-meta button { border: 0; background: transparent; color: var(--accent); cursor: pointer; padding: 0; font-size: 11px; }
.ptype { font-family: var(--f-code); color: var(--ink-2); background: var(--wash); border-radius: 3px; padding: 0 5px; }
.uncited { color: var(--warn); }
dl.ec { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; font-family: var(--f-ui); font-size: var(--s-1); margin: 8px 0 2px; padding: 10px 12px; background: var(--wash); border-radius: 6px; }
dl.ec dt { color: var(--ink-3); font-family: var(--f-code); font-size: 11px; padding-top: 2px; }
dl.ec dd { margin: 0; overflow-wrap: anywhere; }
.fns { font-size: var(--s-1); font-family: var(--f-ui); color: var(--ink-2); }
.fns > div { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 6px; margin: 6px 0; scroll-margin-top: 90px; }
.fns p { margin: 0; }

.pop { position: fixed; z-index: 20; max-width: min(460px, calc(100vw - 32px)); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.18);
  padding: 12px 14px; font-family: var(--f-read); font-size: var(--s0); line-height: 1.45; }
.pop .rid { display: block; margin-bottom: 4px; }
.pop .go { font-family: var(--f-ui); font-size: var(--s-1); margin-top: 8px; display: inline-block; }

/* ---------- xml ---------- */
.xmlview { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; }
.xml-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--rule); font-size: var(--s-1); color: var(--ink-3); }
.xml-tools input { border: 1px solid var(--rule); border-radius: 6px; padding: 5px 10px; background: var(--bg); min-width: 0; flex: 1 1 180px; max-width: 320px; }
.code { overflow: auto; max-height: calc(100vh - 210px); font-family: var(--f-code); font-size: 12.5px; line-height: 1.55; }
.code table { border-collapse: collapse; }
.code td.ln { user-select: none; text-align: right; color: var(--ink-3); padding: 0 10px 0 14px; vertical-align: top; border-right: 1px solid var(--rule); position: sticky; left: 0; background: var(--paper); }
.code td.src { white-space: pre; padding: 0 16px 0 12px; color: var(--code-txt); }
.code tr.hit td.src { background: var(--cite-wash); }
.t { color: var(--code-tag); } .a { color: var(--code-attr); } .v { color: var(--code-val); } .c { color: var(--code-com); font-style: italic; }

/* ---------- verificacao ---------- */
.checks { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 20px; }
.panel h3 { margin: 0 0 4px; font-size: var(--s0); }
.panel .sub { color: var(--ink-3); font-size: var(--s-1); margin: 0 0 12px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.stat { border-left: 3px solid var(--rule); padding: 2px 0 2px 10px; }
.stat b { display: block; font-size: var(--s2); font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: var(--s-1); color: var(--ink-3); }
ul.items { list-style: none; margin: 0; padding: 0; }
ul.items li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-top: 1px solid var(--wash); font-size: var(--s-1); }
ul.items li:first-child { border-top: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.items code { font-family: var(--f-code); font-size: 11.5px; background: var(--wash); padding: 0 4px; border-radius: 3px; overflow-wrap: anywhere; }

.lightbox { position: fixed; inset: 0; z-index: 40; background: rgba(8, 12, 16, .86); display: grid; place-items: center; padding: 24px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 4px; }
.empty { text-align: center; padding: 60px 20px; color: var(--ink-3); }
@media (prefers-reduced-motion: no-preference) { ol.refs li { transition: background .6s; } }
</style>

<header class="bar">
  <div class="bar-in">
    <div class="brand">Leitor SPS <small>XML SciELO PS + imagens</small></div>
    <div class="tabs" role="tablist" aria-label="Visualização">
      <button class="tab" role="tab" id="tab-artigo" aria-selected="true" data-view="artigo">Artigo</button>
      <button class="tab" role="tab" id="tab-xml" aria-selected="false" data-view="xml">XML</button>
      <button class="tab" role="tab" id="tab-check" aria-selected="false" data-view="check">Verificação <span class="n" id="check-n"></span></button>
    </div>
    <div class="loader">
      <select class="btn" id="sample" aria-label="Exemplos">
        <option value="">Exemplos…</option>
        <option value="1562-4730-biblios-88-e001">Biblios 88 · e001</option>
        <option value="1562-4730-biblios-88-e002">Biblios 88 · e002</option>
      </select>
      <select class="btn" id="doc-pick" aria-label="Artigo da pasta" hidden></select>
      <label class="btn" for="folder">Abrir pasta</label>
      <input type="file" id="folder" webkitdirectory directory multiple hidden>
      <label class="btn primary" for="files">Abrir XML / .zip</label>
      <span class="ver" title="versão do leitor">v4</span>
      <input type="file" id="files" multiple accept=".xml,.zip,image/*" hidden>
    </div>
  </div>
</header>

<div class="drop" id="drop" hidden>Solte a pasta, o .zip ou o XML com as imagens</div>

<main class="wrap">
  <div id="msg"></div>
  <section id="view-artigo" class="grid">
    <details class="toc-wrap" id="toc-wrap" open><summary>Índice</summary><nav class="toc" id="toc" aria-label="Índice"></nav></details>

  </section>
  <section id="view-xml" hidden>
    <div class="xmlview">
      <div class="xml-tools">
        <span id="xml-name"></span>
        <input type="search" id="xml-find" placeholder="Buscar no XML (ex.: element-citation)">
        <span id="xml-hits"></span>
        <button class="btn" id="xml-copy">Copiar XML</button>
      </div>
      <div class="code" id="code"></div>
    </div>
  </section>
  <section id="view-check" class="checks" hidden></section>
</main>

<div class="pop" id="pop" hidden></div>
<div class="lightbox" id="lightbox" hidden><img id="lightbox-img" alt=""></div>

<script>
(() => {
  const XLINK = "http://www.w3.org/1999/xlink";
  const XMLNS = "http://www.w3.org/XML/1998/namespace";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const LANGS = { pt: "Português", en: "English", es: "Español", fr: "Français" };

  const state = { doc: null, xmlText: "", name: "", images: new Map(), usedImages: new Set(), citeCount: new Map(), objectUrls: [] };

  // ---------- leitura do XML ----------
  const kids = (el, tag) => el ? [...el.children].filter((c) => !tag || c.localName === tag) : [];
  const kid = (el, tag) => kids(el, tag)[0] || null;
  const q1 = (el, sel) => el ? el.querySelector(sel) : null;
  const qa = (el, sel) => el ? [...el.querySelectorAll(sel)] : [];
  const txt = (el) => el ? el.textContent.replace(/\s+/g, " ").trim() : "";
  const href = (el) => el ? (el.getAttributeNS(XLINK, "href") || el.getAttribute("xlink:href") || "") : "";
  const lang = (el) => el ? (el.getAttributeNS(XMLNS, "lang") || el.getAttribute("xml:lang") || "") : "";
  const byId = (id) => state.doc ? state.doc.querySelector(`[id="${CSS.escape(id)}"]`) : null;

  function imgUrl(name) {
    if (!name) return null;
    const base = name.split("/").pop();
    const hit = state.images.get(base) || state.images.get(base.replace(/\.(tif|tiff)$/i, ".png")) || state.images.get(base.replace(/\.\w+$/, ".jpg"));
    if (hit) state.usedImages.add(base);
    return hit || null;
  }

  // ---------- conteudo misto JATS -> HTML ----------
  function inline(node) {
    let out = "";
    for (const n of node.childNodes) {
      if (n.nodeType === 3) { out += esc(n.nodeValue); continue; }
      if (n.nodeType !== 1) continue;
      out += element(n);
    }
    return out;
  }

  function element(n) {
    const t = n.localName;
    switch (t) {
      case "italic": return `<i>${inline(n)}</i>`;
      case "bold": return `<b>${inline(n)}</b>`;
      case "sup": return `<sup>${inline(n)}</sup>`;
      case "sub": return `<sub>${inline(n)}</sub>`;
      case "sc": return `<span style="font-variant:small-caps">${inline(n)}</span>`;
      case "underline": return `<u>${inline(n)}</u>`;
      case "monospace": return `<code>${inline(n)}</code>`;
      case "break": return "<br>";
      case "ext-link": case "uri": {
        const h = href(n) || txt(n);
        const safe = /^(https?:|ftp:)/i.test(h) ? h : "#";
        return `<a href="${esc(safe)}" target="_blank" rel="noopener">${inline(n)}</a>`;
      }
      case "email": return `<span class="email">${inline(n)}</span>`;
      case "xref": return xref(n);
      case "p": return `<p>${inline(n)}</p>`;
      case "sec": return section(n, 2);
      case "list": return list(n);
      case "fig": return fig(n);
      case "table-wrap": return table(n);
      case "disp-quote": return `<blockquote>${block(n)}</blockquote>`;
      case "inline-graphic": { const u = imgUrl(href(n)); return u ? `<img src="${u}" alt="" style="height:1.2em;vertical-align:middle">` : `[${esc(href(n))}]`; }
      case "label": case "title": return inline(n);
      default: return inline(n);
    }
  }

  function xref(n) {
    const type = n.getAttribute("ref-type") || "";
    const rid = (n.getAttribute("rid") || "").split(/\s+/)[0];
    const target = byId(rid);
    const inner = inline(n);
    if (!target) return `<a class="bad-link" title="rid sem destino: ${esc(rid)}">${inner}</a>`;
    if (type === "bibr") {
      state.citeCount.set(rid, (state.citeCount.get(rid) || 0) + 1);
      return `<a class="cite" data-rid="${esc(rid)}" href="#ref-${esc(rid)}">${inner}</a>`;
    }
    if (type === "fn") return `<a class="fnref" href="#fn-${esc(rid)}" id="fnback-${esc(rid)}">${inner}</a>`;
    if (type === "aff") return inner;
    return `<a href="#x-${esc(rid)}">${inner}</a>`;
  }

  function block(el) {
    let out = "";
    for (const c of el.children) out += element(c);
    return out;
  }

  function section(sec, level) {
    const id = "s" + Math.random().toString(36).slice(2, 8);
    const title = kid(sec, "title");
    const st = sec.getAttribute("sec-type");
    const h = Math.min(level, 4);
    tocEntries.push({ id, text: title ? txt(title) : "(sem título)", level });
    let out = `<section id="${id}">`;
    if (title) out += `<h${h}>${inline(title)}${st ? ` <span class="sectype">${esc(st)}</span>` : ""}</h${h}>`;
    for (const c of sec.children) {
      if (c.localName === "title" || c.localName === "label") continue;
      out += c.localName === "sec" ? section(c, level + 1) : element(c);
    }
    return out + "</section>";
  }

  function list(l) {
    const type = l.getAttribute("list-type") || "bullet";
    const tag = ["order", "alpha-lower", "alpha-upper", "roman-lower", "roman-upper"].includes(type) ? "ol" : "ul";
    const items = kids(l, "list-item").map((li) => `<li>${[...li.children].map((c) => c.localName === "p" ? inline(c) : element(c)).join(" ")}</li>`).join("");
    return `<${tag} class="${esc(type)}">${items}</${tag}>`;
  }

  function capBlock(el) {
    const label = kid(el, "label");
    const cap = kid(el, "caption");
    const title = cap ? kid(cap, "title") : null;
    const extra = cap ? kids(cap, "p").map(inline).join(" ") : "";
    return `${label ? `<b>${inline(label)}</b>` : ""}${title ? inline(title) : ""}${extra ? " " + extra : ""}`;
  }

  function fig(f) {
    const id = f.getAttribute("id") || "";
    const g = kid(f, "graphic") || q1(f, "graphic");
    const name = href(g);
    const url = imgUrl(name);
    const alt = txt(kid(f, "alt-text")) || txt(q1(f, "caption title"));
    figEntries.push({ id: "x-" + id, text: txt(kid(f, "label")) || id });
    const img = url
      ? `<img src="${url}" alt="${esc(alt)}" loading="lazy" data-zoom>`
      : `<div class="missing">Imagem não carregada<br><code>${esc(name || "(sem graphic)")}</code><br>Abra o .zip do pacote ou selecione as imagens junto com o XML.</div>`;
    const attrib = kids(f, "attrib").map((a) => `<div class="attrib">${inline(a)}</div>`).join("");
    return `<figure class="fig" id="x-${esc(id)}"><figcaption>${capBlock(f)}</figcaption>${img}${attrib}${name ? `<div class="fileref">${esc(name)}</div>` : ""}</figure>`;
  }

  function table(tw) {
    const id = tw.getAttribute("id") || "";
    figEntries.push({ id: "x-" + id, text: txt(kid(tw, "label")) || "Tabela " + id });
    let inner = "";
    const t = q1(tw, "table");
    if (t) {
      const cell = (c) => {
        const span = ["colspan", "rowspan"].map((a) => c.getAttribute(a) ? ` ${a}="${esc(c.getAttribute(a))}"` : "").join("");
        return `<${c.localName}${span}>${inline(c)}</${c.localName}>`;
      };
      inner = `<div class="tscroll"><table>${qa(t, "tr").map((tr) => `<tr>${kids(tr).map(cell).join("")}</tr>`).join("")}</table></div>`;
    } else {
      const g = q1(tw, "graphic");
      const url = imgUrl(href(g));
      inner = url ? `<img src="${url}" alt="" data-zoom style="max-width:100%">` : `<div class="missing">Tabela como imagem não carregada<br><code>${esc(href(g))}</code></div>`;
    }
    const foot = qa(tw, "table-wrap-foot p").map((p) => `<div class="attrib">${inline(p)}</div>`).join("");
    return `<div class="twrap" id="x-${esc(id)}"><div class="cap">${capBlock(tw)}</div>${inner}${foot}</div>`;
  }

  // ---------- front ----------
  let tocEntries = [], figEntries = [];

  function dateStr(d) {
    if (!d) return "";
    const y = txt(kid(d, "year")), m = txt(kid(d, "month")), day = txt(kid(d, "day")), s = txt(kid(d, "season"));
    return [day && day.padStart(2, "0"), m && m.padStart(2, "0"), y].filter(Boolean).join("/") || s;
  }

  function renderFront(doc) {
    const jm = q1(doc, "front > journal-meta");
    const am = q1(doc, "front > article-meta");
    const art = doc.documentElement;
    const doi = txt(q1(am, "article-id[pub-id-type='doi']"));
    const jt = txt(q1(jm, "journal-title"));
    const issn = qa(jm, "issn").map((i) => `${txt(i)} (${i.getAttribute("pub-type") || ""})`).join(" · ");
    const vol = txt(kid(am, "volume")), iss = txt(kid(am, "issue"));
    const eloc = txt(kid(am, "elocation-id")) || [txt(kid(am, "fpage")), txt(kid(am, "lpage"))].filter(Boolean).join("–");
    const coll = qa(am, "pub-date").find((p) => p.getAttribute("date-type") === "collection" || p.getAttribute("pub-type") === "collection");
    const subject = txt(q1(am, "article-categories subject"));
    let h = `<div class="read">`;
    h += `<div class="jline"><b>${esc(jt)}</b>${issn ? `<span>ISSN ${esc(issn)}</span>` : ""}${vol ? `<span>v. ${esc(vol)}</span>` : ""}${iss ? `<span>n. ${esc(iss)}</span>` : ""}${eloc ? `<span>${esc(eloc)}</span>` : ""}${coll ? `<span>${esc(txt(kid(coll, "year")))}</span>` : ""}</div>`;
    h += `<span class="chip">${esc(subject || art.getAttribute("article-type") || "artigo")}</span> <span class="lang">${esc(lang(art))}</span><span class="lang">${esc(art.getAttribute("specific-use") || "")}</span>`;
    h += `<h1 class="atitle">${inline(q1(am, "title-group > article-title") || doc.createElement("x"))}</h1>`;
    for (const tg of qa(am, "title-group > trans-title-group")) h += `<div class="ttitle"><span class="lang">${esc(lang(tg))}</span>${inline(kid(tg, "trans-title"))}</div>`;

    const contribs = qa(am, "contrib-group > contrib");
    h += `<div class="authors">` + contribs.map((c) => {
      const nm = kid(c, "name");
      const name = nm ? `${txt(kid(nm, "given-names"))} ${txt(kid(nm, "surname"))}`.trim() : txt(kid(c, "collab"));
      const sups = kids(c, "xref").filter((x) => x.getAttribute("ref-type") === "aff").map((x) => txt(x)).join(",");
      const orcid = txt(qa(c, "contrib-id").find((x) => x.getAttribute("contrib-id-type") === "orcid"));
      return `<span class="author" title="surname: ${esc(txt(q1(c, "surname")))} | given-names: ${esc(txt(q1(c, "given-names")))}">${esc(name)}${sups ? `<sup>${esc(sups)}</sup>` : ""}${orcid ? `<a class="orcid" href="https://orcid.org/${esc(orcid)}" target="_blank" rel="noopener" title="ORCID ${esc(orcid)}">iD</a>` : ""}</span>`;
    }).join("") + `</div>`;
    const affs = qa(am, "aff");
    if (affs.length) {
      h += `<ul class="affs">` + affs.map((a) => {
        const orig = txt(q1(a, "institution[content-type='original']")) || txt(a);
        const cc = q1(a, "country");
        return `<li><sup>${esc(txt(kid(a, "label")))}</sup> ${esc(orig)}${cc ? `<span class="country">${esc(cc.getAttribute("country") || "?")}</span>` : ""}</li>`;
      }).join("") + `</ul>`;
    }
    const emails = contribs.map((c) => txt(kid(c, "email"))).filter(Boolean);

    const hist = {};
    for (const d of qa(am, "history > date")) hist[d.getAttribute("date-type")] = dateStr(d);
    const pub = qa(am, "pub-date").find((p) => (p.getAttribute("date-type") || p.getAttribute("pub-type")) !== "collection");
    const lic = q1(am, "permissions license");
    const licHref = href(lic);
    h += `<dl class="facts">`;
    if (doi) h += `<div><dt>DOI</dt><dd><a href="https://doi.org/${esc(doi)}" target="_blank" rel="noopener">${esc(doi)}</a></dd></div>`;
    if (hist.received) h += `<div><dt>Recebido</dt><dd>${esc(hist.received)}</dd></div>`;
    if (hist.accepted) h += `<div><dt>Aceito</dt><dd>${esc(hist.accepted)}</dd></div>`;
    if (pub) h += `<div><dt>Publicado</dt><dd>${esc(dateStr(pub))}</dd></div>`;
    if (licHref) h += `<div><dt>Licença</dt><dd><a href="${esc(licHref)}" target="_blank" rel="noopener">${esc(licHref.replace(/^https?:\/\/creativecommons\.org\/licenses\//, "CC ").replace(/\/$/, "").replace("/", " ").toUpperCase())}</a></dd></div>`;
    if (emails.length) h += `<div><dt>Contato</dt><dd>${emails.map(esc).join("<br>")}</dd></div>`;
    h += `</dl>`;

    const abstracts = [...qa(am, "abstract"), ...qa(am, "trans-abstract")];
    if (abstracts.length) {
      h += `<div class="abs"><div class="abs-tabs" role="tablist">` + abstracts.map((a, i) => {
        const l = lang(a) || lang(art);
        return `<button role="tab" data-abs="${i}" aria-selected="${i === 0}">${esc(txt(kid(a, "title")) || LANGS[l] || l)}</button>`;
      }).join("") + `</div>`;
      abstracts.forEach((a, i) => {
        const l = lang(a) || lang(art);
        const secs = kids(a, "sec");
        let body = secs.length
          ? secs.map((s) => `<div class="asec"><b>${esc(txt(kid(s, "title")))}</b>${kids(s, "p").map(inline).join(" ")}</div>`).join("")
          : kids(a, "p").map((p) => `<p>${inline(p)}</p>`).join("");
        const kg = qa(am, "kwd-group").find((k) => lang(k) === l);
        if (kg) body += `<div class="kwd"><b>${esc(txt(kid(kg, "title")))}</b> ${kids(kg, "kwd").map((k) => `<span class="k">${inline(k)}</span>`).join("")}</div>`;
        h += `<div class="abs-body" data-abs-body="${i}" ${i ? "hidden" : ""}><span class="lang">${esc(l)}</span>${secs.length ? `<small style="font-family:var(--f-ui);color:var(--ink-3)">${secs.length} seções</small>` : ""}${body}</div>`;
      });
      h += `</div>`;
    }
    const notes = qa(am, "author-notes > fn");
    const fund = q1(am, "funding-group");
    if (notes.length || fund) {
      h += `<div class="notes-box">`;
      const labels = { con: "Contribuição de autoria", conflict: "Conflito de interesses", "edited-by": "Edição", corresp: "Correspondência" };
      for (const fn of notes) h += `<p><span class="ptype">${esc(fn.getAttribute("fn-type") || "fn")}</span> ${kids(fn, "p").map(inline).join(" · ")}</p>`;
      if (fund) {
        const srcs = qa(fund, "award-group").map((g) => `${esc(txt(kid(g, "funding-source")))}${qa(g, "award-id").map((x) => ` <code>${esc(txt(x))}</code>`).join("")}`).join("; ");
        h += `<p><span class="ptype">funding</span> ${srcs}</p>`;
      }
      h += `</div>`;
    }
    return h + `</div>`;
  }

  // ---------- back ----------
  const EC_FIELDS = ["person-group", "article-title", "chapter-title", "source", "series", "edition", "publisher-loc", "publisher-name", "volume", "issue", "fpage", "lpage", "elocation-id", "size", "year", "pub-id", "comment", "date-in-citation"];

  function personGroup(pg) {
    const people = kids(pg).map((p) => p.localName === "name" ? `${txt(kid(p, "surname"))}, ${txt(kid(p, "given-names"))}` : p.localName === "etal" ? "et al." : txt(p));
    return `<span class="ptype">${esc(pg.getAttribute("person-group-type") || "")}</span> ${esc(people.join("; "))}`;
  }

  function renderBack(doc) {
    const back = q1(doc, "back");
    if (!back) return "";
    let h = `<div class="back read">`;
    for (const ack of kids(back, "ack")) h += `<h2 id="x-ack">${esc(txt(kid(ack, "title")) || "Agradecimentos")}</h2><div class="body">${kids(ack, "p").map((p) => `<p>${inline(p)}</p>`).join("")}</div>`;
    const rl = kid(back, "ref-list");
    if (rl) {
      h += `<h2 id="x-refs">${esc(txt(kid(rl, "title")) || "Referências")} <span class="sectype">${kids(rl, "ref").length}</span></h2><ol class="refs">`;
      for (const ref of kids(rl, "ref")) {
        const id = ref.getAttribute("id");
        const ec = kid(ref, "element-citation");
        const n = state.citeCount.get(id) || 0;
        const fields = ec ? kids(ec).filter((c) => EC_FIELDS.includes(c.localName)).map((c) => {
          const label = c.localName + (c.getAttribute("pub-id-type") ? `[${c.getAttribute("pub-id-type")}]` : "") + (c.getAttribute("content-type") ? `[${c.getAttribute("content-type")}]` : "");
          return `<dt>${esc(label)}</dt><dd>${c.localName === "person-group" ? personGroup(c) : inline(c)}</dd>`;
        }).join("") : "";
        h += `<li id="ref-${esc(id)}"><span class="rid">${esc(id)}</span><div>${inline(kid(ref, "mixed-citation") || ref)}
          <div class="ref-meta"><span class="ptype">${esc(ec ? ec.getAttribute("publication-type") : "sem element-citation")}</span>
          <span class="${n ? "" : "uncited"}">${n ? `citada ${n}×` : "sem chamada no texto"}</span>
          <button type="button" data-ec="${esc(id)}" aria-expanded="false">estrutura</button></div>
          <dl class="ec" data-ec-body="${esc(id)}" hidden>${fields}</dl></div></li>`;
      }
      h += `</ol>`;
    }
    const fns = qa(back, "fn-group > fn");
    if (fns.length) {
      h += `<h2 id="x-notes">Notas</h2><div class="fns">` + fns.map((fn) => {
        const id = fn.getAttribute("id");
        return `<div id="fn-${esc(id)}"><span>${esc(txt(kid(fn, "label")))}${byId(id) && state.doc.querySelector(`xref[rid="${CSS.escape(id)}"]`) ? ` <a href="#fnback-${esc(id)}" title="voltar">↩</a>` : ""}</span><div>${kids(fn, "p").map((p) => `<p>${inline(p)}</p>`).join("")}</div></div>`;
      }).join("") + `</div>`;
    }
    for (const app of qa(back, "app-group > app")) {
      h += `<h2 id="x-${esc(app.getAttribute("id"))}">${inline(kid(app, "title") || app)}</h2><div class="body">${[...app.children].filter((c) => c.localName !== "title").map(element).join("")}</div>`;
    }
    return h + `</div>`;
  }

  // ---------- montagem ----------
  function renderArticle() {
    const doc = state.doc;
    tocEntries = []; figEntries = []; state.citeCount = new Map(); state.usedImages = new Set();
    const front = renderFront(doc);
    const bodyEl = q1(doc, "article > body");
    const body = bodyEl ? `<div class="body read">${block(bodyEl)}</div>` : "";
    const back = renderBack(doc);
    $("#paper").innerHTML = front + body + back;
    const backEl = q1(doc, "back");
    let toc = `<h4>Seções</h4>` + tocEntries.filter((e) => e.level <= 3).map((e) => `<a href="#${e.id}" class="${e.level > 2 ? "l2" : ""}">${esc(e.text)}</a>`).join("");
    if (figEntries.length) toc += `<h4>Figuras e tabelas</h4>` + figEntries.map((e) => `<a href="#${esc(e.id)}">${esc(e.text)}</a>`).join("");
    toc += `<h4>Final</h4>`;
    if (q1(backEl, "ref-list")) toc += `<a href="#x-refs">Referências (${qa(backEl, "ref-list > ref").length})</a>`;
    if (q1(backEl, "fn-group")) toc += `<a href="#x-notes">Notas</a>`;
    for (const app of qa(backEl, "app-group > app")) toc += `<a href="#x-${esc(app.getAttribute("id"))}">${esc(txt(kid(app, "title")))}</a>`;
    toc += `<h4>Arquivo</h4><div class="meta-line">${esc(state.name)}</div><div class="meta-line">${state.images.size} imagem(ns) carregada(s)</div>`;
    $("#toc").innerHTML = toc;
  }

  // ---------- XML com destaque ----------
  function highlightLine(line) {
    let s = esc(line);
    s = s.replace(/(&lt;!--.*?--&gt;)/g, '<span class="c">$1</span>');
    s = s.replace(/(&lt;\/?)([\w:.-]+)((?:\s+[\w:.-]+=&quot;.*?&quot;)*)(\s*\/?&gt;)?/g, (m, open, name, attrs, close) =>
      `<span class="t">${open}${name}</span>` + (attrs || "").replace(/([\w:.-]+)=(&quot;.*?&quot;)/g, '<span class="a">$1</span>=<span class="v">$2</span>') + (close ? `<span class="t">${close}</span>` : ""));
    return s;
  }

  function renderXml() {
    const lines = state.xmlText.split("\n");
    const rows = lines.map((l, i) => `<tr data-line="${i}"><td class="ln">${i + 1}</td><td class="src">${highlightLine(l)}</td></tr>`).join("");
    $("#code").innerHTML = `<table>${rows}</table>`;
    $("#xml-name").textContent = `${state.name} · ${lines.length} linhas · ${(state.xmlText.length / 1024).toFixed(0)} KB`;
    $("#xml-hits").textContent = "";
  }

  // ---------- verificacao rapida ----------
  function renderChecks() {
    const doc = state.doc, am = q1(doc, "front > article-meta"), art = doc.documentElement;
    const items = [];
    const add = (level, text) => items.push({ level, text });
    const graphics = qa(doc, "graphic, inline-graphic").map(href).filter(Boolean);
    const missing = graphics.filter((g) => !imgUrl(g));
    if (!graphics.length) add("ok", "O XML não referencia imagens.");
    else if (missing.length) add("bad", `${missing.length} de ${graphics.length} imagem(ns) referenciada(s) não foram carregadas: ${missing.map((m) => `<code>${esc(m)}</code>`).join(" ")}`);
    else add("ok", `Todas as ${graphics.length} imagens referenciadas foram encontradas.`);
    const extra = [...state.images.keys()].filter((k) => !graphics.some((g) => g.split("/").pop() === k));
    if (extra.length) add("warn", `Imagens no pacote que o XML não usa: ${extra.map((m) => `<code>${esc(m)}</code>`).join(" ")}`);
    const broken = qa(doc, "xref").filter((x) => (x.getAttribute("rid") || "").split(/\s+/).some((r) => !byId(r)));
    add(broken.length ? "bad" : "ok", broken.length ? `${broken.length} xref com rid sem destino: ${broken.slice(0, 8).map((x) => `<code>${esc(x.getAttribute("rid"))}</code>`).join(" ")}` : "Todos os xref apontam para elementos existentes.");
    const refs = qa(doc, "ref-list > ref");
    const cited = new Set(qa(doc, "xref[ref-type='bibr']").flatMap((x) => (x.getAttribute("rid") || "").split(/\s+/)));
    const uncited = refs.filter((r) => !cited.has(r.getAttribute("id")));
    add(uncited.length ? "warn" : "ok", uncited.length ? `${uncited.length} de ${refs.length} referências sem chamada ligada no texto: ${uncited.map((r) => `<code>${esc(r.getAttribute("id"))}</code>`).join(" ")}` : `Todas as ${refs.length} referências têm chamada no texto.`);
    const noEc = refs.filter((r) => !kid(r, "element-citation"));
    if (noEc.length) add("bad", `${noEc.length} referência(s) sem element-citation.`);
    const counts = q1(am, "counts");
    if (counts) {
      for (const [tag, sel] of [["fig-count", "fig"], ["table-count", "table-wrap"], ["ref-count", "ref"], ["equation-count", "disp-formula"]]) {
        const c = q1(counts, tag);
        if (c && +c.getAttribute("count") !== qa(doc, sel).length) add("bad", `<code>${tag}</code> = ${c.getAttribute("count")}, mas o XML tem ${qa(doc, sel).length} <code>${sel}</code>.`);
      }
    }
    const pubDates = qa(am, "pub-date");
    if (!pubDates.some((p) => p.getAttribute("date-type") === "pub")) add("bad", `Falta <code>pub-date date-type="pub"</code> (exigido no SPS 1.8).`);
    if (pubDates.some((p) => !p.getAttribute("publication-format"))) add("bad", `<code>pub-date</code> sem <code>publication-format</code>.`);
    const su = art.getAttribute("specific-use");
    add(su ? "ok" : "bad", su ? `Versão declarada: <code>${esc(su)}</code>, JATS <code>${esc(art.getAttribute("dtd-version") || "?")}</code>.` : "Artigo sem <code>specific-use</code> (versão SPS).");
    if (!q1(am, "article-id[pub-id-type='doi']")) add("warn", "Sem DOI em <code>article-id</code>.");
    const noOrcid = qa(am, "contrib-group > contrib").filter((c) => !qa(c, "contrib-id").some((x) => x.getAttribute("contrib-id-type") === "orcid"));
    if (noOrcid.length) add("warn", `${noOrcid.length} autor(es) sem ORCID: ${noOrcid.map((c) => esc(txt(q1(c, "surname")))).join(", ")}`);
    for (const a of qa(am, "aff")) {
      if (!q1(a, "institution[content-type='original']")) add("bad", `<code>${esc(a.getAttribute("id"))}</code> sem institution original.`);
      const c = q1(a, "country");
      if (!c || !c.getAttribute("country")) add("warn", `<code>${esc(a.getAttribute("id"))}</code> sem código ISO de país.`);
    }
    const abs = [...qa(am, "abstract"), ...qa(am, "trans-abstract")];
    const kg = qa(am, "kwd-group").map(lang);
    for (const a of abs) { const l = lang(a) || lang(art); if (!kg.includes(l)) add("warn", `Resumo em <code>${esc(l)}</code> sem palavras-chave no mesmo idioma.`); }
    for (const c of qa(doc, "caption")) if (!q1(c, "title") || !txt(q1(c, "title"))) add("bad", "Legenda (<code>caption</code>) sem <code>title</code>.");

    const bad = items.filter((i) => i.level === "bad").length, warn = items.filter((i) => i.level === "warn").length;
    const n = $("#check-n");
    n.textContent = bad || warn || "✓";
    n.className = "n " + (bad ? "bad" : warn ? "warn" : "ok");
    const types = {};
    refs.forEach((r) => { const t = kid(r, "element-citation")?.getAttribute("publication-type") || "?"; types[t] = (types[t] || 0) + 1; });
    const stat = (v, l, c) => `<div class="stat" style="border-color:var(--${c || "rule"})"><b>${v}</b><span>${l}</span></div>`;
    $("#view-check").innerHTML = `
      <div class="panel"><h3>Resumo do documento</h3><p class="sub">${esc(state.name)}</p>
        <div class="stats">
          ${stat(qa(doc, "contrib-group > contrib").length, "autores")}
          ${stat(abs.length, "resumos")}
          ${stat(qa(doc, "body sec").length, "seções no corpo")}
          ${stat(qa(doc, "fig").length, "figuras")}
          ${stat(qa(doc, "table-wrap").length, "tabelas")}
          ${stat(refs.length, "referências")}
          ${stat(qa(doc, "xref[ref-type='bibr']").length, "chamadas ligadas")}
          ${stat(qa(doc, "back fn-group fn").length, "notas")}
        </div>
        <p class="sub" style="margin:14px 0 0">Tipos de referência: ${Object.entries(types).sort((a, b) => b[1] - a[1]).map(([t, c]) => `<span class="ptype">${esc(t)}</span> ${c}`).join(" &nbsp; ")}</p>
      </div>
      <div class="panel"><h3>Verificação rápida</h3>
        <p class="sub">Conferências feitas no navegador sobre o XML carregado. A validação completa (DTD JATS 1.1 e schematron SPS 1.8) é a etapa 03 do pipeline.</p>
        <ul class="items">${items.sort((a, b) => ({ bad: 0, warn: 1, ok: 2 }[a.level] - { bad: 0, warn: 1, ok: 2 }[b.level])).map((i) => `<li><span class="dot ${i.level}"></span><span>${i.text}</span></li>`).join("")}</ul>
      </div>`;
  }

  // ---------- carregamento ----------
  function message(html, err) { $("#msg").innerHTML = html ? `<div class="toast ${err ? "err" : ""}">${html}</div>` : ""; }

  function resetImages() {
    state.objectUrls.forEach((u) => URL.revokeObjectURL(u));
    state.objectUrls = []; state.images = new Map();
  }
  function addImage(name, blob) {
    const u = URL.createObjectURL(blob);
    state.objectUrls.push(u);
    state.images.set(name.split("/").pop(), u);
  }

  function loadXml(text, name) {
    const doc = new DOMParser().parseFromString(text, "application/xml");
    const err = doc.querySelector("parsererror");
    if (err) { message(`<b>${esc(name)}</b> não é um XML bem formado: ${esc(txt(err).slice(0, 300))}`, true); return false; }
    if (doc.documentElement.localName !== "article") { message(`<b>${esc(name)}</b> não tem <code>&lt;article&gt;</code> como raiz.`, true); return false; }
    state.doc = doc; state.xmlText = text; state.name = name;
    renderArticle(); renderXml(); renderChecks();
    return true;
  }

  async function handleFiles(fileList) {
    const files = [...fileList].filter((f) => !/(^|\/)(\.|__MACOSX)/.test(f.webkitRelativePath || f.name));
    if (!files.length) return;
    resetImages();
    const xmls = [];
    const rel = (f) => f.webkitRelativePath || f.relPath || f.name;
    // pasta com os pacotes ja descompactados e tambem os .zip: usa os arquivos soltos
    const hasLooseXml = files.some((f) => /\.xml$/i.test(f.name));
    for (const f of files) {
      if (/\.zip$/i.test(f.name)) {
        if (hasLooseXml) continue;
        let entries;
        try { entries = await readZip(f); }
        catch (err) { message(`Não consegui abrir <b>${esc(f.name)}</b>: ${esc(err.message)}. Descompacte e use “Abrir pasta”.`, true); continue; }
        for (const entry of entries) {
          if (/(^|\/)(\.|__MACOSX)/.test(entry.name)) continue;
          if (/\.xml$/i.test(entry.name)) xmls.push({ name: entry.name.split("/").pop(), path: `${f.name}/${entry.name}`, text: new TextDecoder().decode(await entry.data()) });
          else if (/\.(png|jpe?g|gif|svg|webp|tiff?)$/i.test(entry.name)) {
            const type = /\.svg$/i.test(entry.name) ? "image/svg+xml" : /\.png$/i.test(entry.name) ? "image/png" : /\.jpe?g$/i.test(entry.name) ? "image/jpeg" : "";
            addImage(entry.name, new Blob([await entry.data()], type ? { type } : {}));
          }
        }
      } else if (/\.xml$/i.test(f.name)) {
        xmls.push({ name: f.name, path: rel(f), text: await f.text() });
      } else if (f.type.startsWith("image/") || /\.(png|jpe?g|gif|svg|webp|tiff?)$/i.test(f.name)) {
        addImage(f.name, f);
      }
    }
    // so XMLs de artigo (descarta manifest, configs etc.)
    const articles = xmls.filter((x) => /<article[\s>]/.test(x.text)).sort((a, b) => a.name.localeCompare(b.name));
    if (!articles.length) {
      if (state.xmlText && state.images.size) { message(`${state.images.size} imagem(ns) carregada(s) para o XML atual.`); renderArticle(); renderChecks(); }
      else message("Nenhum XML de artigo encontrado. Abra a pasta do pacote, o <code>.zip</code> ou o <code>.xml</code> com as imagens.", true);
      return;
    }
    state.articles = articles;
    const pick = $("#doc-pick");
    pick.hidden = articles.length < 2;
    pick.innerHTML = articles.map((a, i) => `<option value="${i}">${esc(a.name.replace(/\.xml$/i, ""))}</option>`).join("");
    openArticle(0);
    $("#sample").value = "";
  }

  function openArticle(i) {
    const a = state.articles[i];
    if (!a || !loadXml(a.text, a.name)) return;
    const missing = qa(state.doc, "graphic").map(href).filter((g) => !imgUrl(g)).length;
    const many = state.articles.length > 1 ? `${state.articles.length} artigos encontrados; troque de artigo pelo seletor no topo. ` : "";
    message(missing ? `${many}${esc(a.name)}: ${missing} imagem(ns) não encontrada(s) nos arquivos abertos.` : many);
    window.scrollTo(0, 0);
  }

  // leitor de .zip sem biblioteca: diretorio central + DecompressionStream("deflate-raw")
  async function readZip(file) {
    const buf = new Uint8Array(await file.arrayBuffer());
    const dv = new DataView(buf.buffer);
    let eocd = -1;
    for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error("arquivo .zip inválido");
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const out = [];
    for (let n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("diretório do .zip corrompido");
      const flags = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
      const local = dv.getUint32(p + 42, true);
      const nameBytes = buf.subarray(p + 46, p + 46 + nlen);
      const name = (flags & 0x800) ? new TextDecoder().decode(nameBytes) : new TextDecoder("utf-8").decode(nameBytes);
      p += 46 + nlen + xlen + clen;
      if (name.endsWith("/")) continue;
      const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
      const raw = buf.subarray(start, start + csize);
      out.push({
        name,
        data: async () => {
          if (method === 0) return raw.slice();
          if (method !== 8) throw new Error(`compressão ${method} não suportada`);
          if (typeof DecompressionStream === "undefined") throw new Error("este navegador não descompacta .zip (atualize o Safari)");
          const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
          return new Uint8Array(await new Response(stream).arrayBuffer());
        },
      });
    }
    return out;
  }

  // arrastar pasta: percorre os diretorios (webkitGetAsEntry)
  async function filesFromDrop(dt) {
    const items = [...(dt.items || [])].map((it) => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
    if (!items.length) return [...dt.files];
    const out = [];
    const walk = async (entry, path) => {
      if (entry.isFile) {
        const f = await new Promise((res, rej) => entry.file(res, rej));
        f.relPath = path + entry.name;
        out.push(f);
      } else if (entry.isDirectory) {
        const reader = entry.createReader();
        let batch;
        do {
          batch = await new Promise((res, rej) => reader.readEntries(res, rej));
          for (const e of batch) await walk(e, path + entry.name + "/");
        } while (batch.length);
      }
    };
    for (const e of items) await walk(e, "");
    return out;
  }

  async function loadSample(base) {
    message("");
    resetImages();
    state.articles = []; $("#doc-pick").hidden = true;
    try {
      const res = await fetch(`samples/${base}/${base}.xml`);
      if (!res.ok) throw new Error(res.status);
      const text = await res.text();
      const doc = new DOMParser().parseFromString(text, "application/xml");
      const names = [...doc.getElementsByTagName("graphic")].map(href).filter(Boolean);
      await Promise.all(names.map(async (n) => {
        const r = await fetch(`samples/${base}/${n}`);
        if (r.ok) addImage(n, await r.blob());
      }));
      loadXml(text, `${base}.xml`);
    } catch (e) {
      $("#paper").innerHTML = `<div class="empty">Abra o <b>pasta</b> ou o <b>.zip</b> de um pacote, ou selecione o <b>.xml</b> junto com as imagens pelos botões “Abrir pasta” ou “Abrir XML / .zip”, ou arraste os arquivos para esta janela.</div>`;
      if (location.protocol !== "file:") message(`Não foi possível carregar o exemplo (${esc(e.message)}). Abra um XML pelo botão.`, true);
    }
  }

  // ---------- interacao ----------
  $("#files").addEventListener("change", (e) => { handleFiles(e.target.files); e.target.value = ""; });
  $("#folder").addEventListener("change", (e) => { handleFiles(e.target.files); e.target.value = ""; });
  $("#doc-pick").addEventListener("change", (e) => openArticle(+e.target.value));
  $("#sample").addEventListener("change", (e) => { if (e.target.value) loadSample(e.target.value); });
  let dragDepth = 0;
  window.addEventListener("dragenter", (e) => { if ([...e.dataTransfer.types].includes("Files")) { dragDepth++; $("#drop").hidden = false; } });
  window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("#drop").hidden = true; });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", async (e) => { e.preventDefault(); dragDepth = 0; $("#drop").hidden = true; handleFiles(await filesFromDrop(e.dataTransfer)); });

  function showView(v) {
    for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", String(t.dataset.view === v));
    $("#view-artigo").hidden = v !== "artigo"; $("#view-xml").hidden = v !== "xml"; $("#view-check").hidden = v !== "check";
    try { localStorage.setItem("leitor-sps-view", v); } catch (e) {}
  }
  for (const t of document.querySelectorAll(".tab")) t.addEventListener("click", () => showView(t.dataset.view));

  const pop = $("#pop");
  function openPop(a) {
    const rid = a.dataset.rid;
    const ref = byId(rid);
    if (!ref) return;
    document.querySelectorAll("a.cite.on").forEach((x) => x.classList.remove("on"));
    a.classList.add("on");
    pop.innerHTML = `<span class="rid">${esc(rid)} · ${esc(kid(ref, "element-citation")?.getAttribute("publication-type") || "")}</span>${inline(kid(ref, "mixed-citation") || ref)}<br><a class="go" href="#ref-${esc(rid)}" data-go="${esc(rid)}">Ir para a referência ↓</a>`;
    pop.hidden = false;
    const r = a.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    let left = Math.min(Math.max(16, r.left), window.innerWidth - w - 16);
    let top = r.bottom + 8;
    if (top + h > window.innerHeight - 16) top = Math.max(16, r.top - h - 8);
    pop.style.left = left + "px"; pop.style.top = top + "px";
  }
  document.addEventListener("click", (e) => {
    const cite = e.target.closest("a.cite");
    if (cite) { e.preventDefault(); openPop(cite); return; }
    const go = e.target.closest("[data-go]");
    if (go) {
      e.preventDefault(); pop.hidden = true;
      const li = document.getElementById("ref-" + go.dataset.go);
      if (li) { li.scrollIntoView({ block: "center", behavior: "smooth" }); li.classList.add("flash"); setTimeout(() => li.classList.remove("flash"), 1600); }
      return;
    }
    if (!e.target.closest("#pop")) { pop.hidden = true; document.querySelectorAll("a.cite.on").forEach((x) => x.classList.remove("on")); }
    const tabBtn = e.target.closest("[data-abs]");
    if (tabBtn) {
      const box = tabBtn.closest(".abs");
      box.querySelectorAll("[data-abs]").forEach((b) => b.setAttribute("aria-selected", String(b === tabBtn)));
      box.querySelectorAll("[data-abs-body]").forEach((b) => { b.hidden = b.dataset.absBody !== tabBtn.dataset.abs; });
    }
    const ecBtn = e.target.closest("[data-ec]");
    if (ecBtn) {
      const body = document.querySelector(`[data-ec-body="${CSS.escape(ecBtn.dataset.ec)}"]`);
      body.hidden = !body.hidden; ecBtn.setAttribute("aria-expanded", String(!body.hidden));
    }
    const zoom = e.target.closest("img[data-zoom]");
    if (zoom) { $("#lightbox-img").src = zoom.src; $("#lightbox").hidden = false; }
    if (e.target.closest("#lightbox")) $("#lightbox").hidden = true;
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { pop.hidden = true; $("#lightbox").hidden = true; } });
  window.addEventListener("scroll", () => { if (!pop.hidden) pop.hidden = true; }, { passive: true });

  let findTimer;
  $("#xml-find").addEventListener("input", (e) => {
    clearTimeout(findTimer);
    findTimer = setTimeout(() => {
      const q = e.target.value.trim().toLowerCase();
      const rows = document.querySelectorAll("#code tr");
      let hits = 0, first = null;
      const lines = state.xmlText.split("\n");
      rows.forEach((tr, i) => {
        const hit = q && lines[i].toLowerCase().includes(q);
        tr.classList.toggle("hit", !!hit);
        if (hit) { hits++; first = first || tr; }
      });
      $("#xml-hits").textContent = q ? `${hits} linha(s)` : "";
      if (first) first.scrollIntoView({ block: "center" });
    }, 180);
  });
  $("#xml-copy").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    try { await navigator.clipboard.writeText(state.xmlText); btn.textContent = "Copiado"; }
    catch (err) {
      const range = document.createRange(); range.selectNodeContents($("#code"));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); btn.textContent = "Selecionado: use Ctrl/Cmd+C";
    }
    setTimeout(() => (btn.textContent = "Copiar XML"), 2200);
  });

  const narrow = matchMedia("(max-width: 860px)");
  const syncToc = () => { $("#toc-wrap").open = !narrow.matches; };
  syncToc(); narrow.addEventListener("change", syncToc);
  $("#toc").addEventListener("click", (e) => { if (narrow.matches && e.target.closest("a")) $("#toc-wrap").open = false; });

  let startView = "artigo";
  try { startView = localStorage.getItem("leitor-sps-view") || "artigo"; } catch (e) {}
  showView(location.hash === "#xml" ? "xml" : location.hash === "#verificacao" ? "check" : startView);
  $("#sample").value = "1562-4730-biblios-88-e001";
  loadSample("1562-4730-biblios-88-e001");
})();
</script>
